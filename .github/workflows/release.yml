name: Studio release (Rust)

# Builds the Rust product and visual installers for every supported platform in the layout the installed updater expects
# (bin/chxchx-studio, a macOS .app, a Windows zip and MSI, plus the CLI wheel) and, only when asked,
# replaces the rolling `studio-dev-preview` release that machines on the `dev` channel read.
# `dev` replaces the rolling `studio-dev-preview` prerelease; `stable` publishes the release
# `v<version>` that every installed Studio on the stable channel updates to. Run it by hand:
# Actions > this workflow > Run workflow (with `publish` off it only builds and stages).
on:
  # Pushing a tag `vX.Y.Z` publishes that stable release (`git tag v0.6.1 && git push origin v0.6.1`).
  push:
    tags: ["v*"]
    # Every push to `dev` refreshes the rolling `studio-dev-preview` for the machines on the dev channel.
    branches: [dev]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to publish to"
        type: choice
        options: [dev, stable]
        default: dev
      publish:
        description: "Publish it (false = build and stage only, to inspect the assets)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Cargo and the CLI wheel report the same version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag names this version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "El tag $GITHUB_REF_NAME no coincide con la versión $version de Cargo.toml."; exit 1; }
      - name: Compare versions
        run: |
          python3 - <<'PY'
          import re, tomllib
          cargo = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          py = tomllib.load(open("old-version/pyproject.toml", "rb"))["project"]["version"]
          # 0.6.0-alpha.1 (semver) is 0.6.0a1 (PEP 440).
          normalized = re.sub(r"-(alpha|beta|rc)\.?(\d+)", lambda m: {"alpha": "a", "beta": "b", "rc": "rc"}[m[1]] + m[2], cargo)
          if normalized != py:
              raise SystemExit(f"Cargo.toml ({cargo}) y pyproject.toml ({py}) no son la misma versión.")
          if "${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) }}" == "stable" and not re.fullmatch(r"\d+\.\d+\.\d+", cargo):
              raise SystemExit(f"Una versión estable debe ser X.Y.Z; Cargo.toml dice {cargo}.")
          print("Versión del producto:", cargo)
          PY

  linux:
    name: Linux x86_64 package
    needs: check-version
    # glibc 2.35: the oldest the installer accepts.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install window build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev
      - uses: astral-sh/setup-uv@v5
      - name: Test the Linux installer, managed PATH and future command shims
        run: uv run --locked pytest tests/installers/test_install_sh.py
        working-directory: old-version
      - run: cargo build --locked --release --features visual-installer
      - name: Package (bin/chxchx-studio inside one folder)
        run: |
          set -euo pipefail
          root=chxchx-studio-linux
          mkdir -p "$root/bin"
          cp target/release/chxchx-studio "$root/bin/"
          for binary in target/release/chxchx target/release/chxchx-*; do
            [ -x "$binary" ] || continue
            case "${binary##*/}" in
              chxchx-studio|chxchx-installer|chxchx-python-helper) continue ;;
            esac
            cp "$binary" "$root/bin/"
          done
          test -x "$root/bin/chxchx-tech"
          test -x "$root/bin/chxchx"
          "$root/bin/chxchx-tech" --version
          tar -czf chxchx-studio-linux-x86_64.tar.gz "$root"
          installer=chxchx-installer-linux
          mkdir -p "$installer/bin"
          cp target/release/chxchx-installer "$installer/bin/"
          cat > "$installer/iniciar-instalador.sh" <<'SCRIPT'
          #!/usr/bin/env sh
          exec "$(dirname "$0")/bin/chxchx-installer" "$@"
          SCRIPT
          chmod +x "$installer/iniciar-instalador.sh"
          cat > "$installer/LEEME.txt" <<'TEXT'
          Extrae esta carpeta y abre iniciar-instalador.sh para instalar ChxChx Studio.
          Basic Memory y Serena se descargan durante la instalación. Se necesita conexión.
          TEXT
          tar -czf chxchx-installer-linux-x86_64.tar.gz "$installer"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: chxchx-studio-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer-package
          path: chxchx-installer-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x86_64 ZIP, MSI and installer lifecycle
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install WiX Toolset 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - run: cargo build --locked --release
      - name: Verify Windows executable resources and runtime dependencies
        shell: pwsh
        run: ./scripts/verify_windows_binaries.ps1 -BinDirectory target/release
      - name: Build the offline per-user MSI and a major-upgrade fixture
        shell: pwsh
        run: |
          $channel = "${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) }}"
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          ./scripts/build_windows_msi.ps1 -Channel $channel -Version $version -Commit $env:GITHUB_SHA -BuildSmokeUpdate
      - name: Test silent MSI install, app launch, major upgrade and uninstall
        shell: pwsh
        run: |
          $channel = "${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) }}"
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          ./scripts/test_windows_msi.ps1 -Channel $channel -Version $version -Commit $env:GITHUB_SHA `
            -Installer dist/windows-msi/chxchx-studio-windows-x86_64.msi `
            -UpdateInstaller dist/windows-msi-smoke-update/chxchx-studio-windows-x86_64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi-package
          path: dist/windows-msi/*.msi
          if-no-files-found: error
          compression-level: 0
      - name: Package (bin/chxchx-studio.exe inside one folder)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'chxchx-studio-windows'
          New-Item -ItemType Directory -Force "$root/bin" | Out-Null
          Copy-Item target/release/chxchx-studio.exe "$root/bin/"
          Get-ChildItem target/release -File -Filter 'chxchx*.exe' |
            Where-Object { $_.Name -notin @('chxchx-studio.exe', 'chxchx-installer.exe', 'chxchx-python-helper.exe') } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination "$root/bin/" }
          foreach ($Name in 'chxchx-tech.exe', 'chxchx.exe') {
            if (-not (Test-Path "$root/bin/$Name")) { throw "Falta $Name en el ZIP." }
          }
          & "$root/bin/chxchx-tech.exe" --version
          Compress-Archive -Path $root -DestinationPath chxchx-studio-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: chxchx-studio-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS ${{ matrix.name }} app
    needs: check-version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64, target: aarch64-apple-darwin }
          - { name: x86_64, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build for ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --features visual-installer --target ${{ matrix.target }}
      - name: Make the .app bundle and the DMG
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"].split("-")[0])')
          app="ChxChx Studio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/${{ matrix.target }}/release/chxchx-studio "$app/Contents/MacOS/"
          for binary in target/${{ matrix.target }}/release/chxchx target/${{ matrix.target }}/release/chxchx-*; do
            [ -x "$binary" ] || continue
            case "${binary##*/}" in
              chxchx-studio|chxchx-installer|chxchx-python-helper) continue ;;
            esac
            cp "$binary" "$app/Contents/MacOS/"
          done
          test -x "$app/Contents/MacOS/chxchx-tech"
          test -x "$app/Contents/MacOS/chxchx"
          # Icon from the brand mark.
          icons=$(mktemp -d)/chxchx.iconset
          mkdir -p "$icons"
          for size in 16 32 64 128 256; do
            sips -z $size $size assets/brand/mark-256.png --out "$icons/icon_${size}x${size}.png" >/dev/null
          done
          iconutil -c icns "$icons" -o "$app/Contents/Resources/chxchx.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>chxchx-studio</string>
            <key>CFBundleIdentifier</key><string>dev.chxchx.studio</string>
            <key>CFBundleName</key><string>ChxChx Studio</string>
            <key>CFBundleDisplayName</key><string>ChxChx Studio</string>
            <key>CFBundleIconFile</key><string>chxchx</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Ad-hoc signature: Apple Silicon refuses unsigned code. (Not notarized.)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir dmg && cp -R "$app" dmg/
          hdiutil create -volname "ChxChx Studio" -srcfolder dmg -ov -format UDZO "chxchx-studio-macos-${{ matrix.name }}.dmg"
          installer="ChxChx Installer.app"
          mkdir -p "$installer/Contents/MacOS" "$installer/Contents/Resources"
          cp target/${{ matrix.target }}/release/chxchx-installer "$installer/Contents/MacOS/"
          cp "$app/Contents/Resources/chxchx.icns" "$installer/Contents/Resources/"
          cat > "$installer/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>chxchx-installer</string>
            <key>CFBundleIdentifier</key><string>dev.chxchx.installer</string>
            <key>CFBundleName</key><string>ChxChx Installer</string>
            <key>CFBundleDisplayName</key><string>ChxChx Installer</string>
            <key>CFBundleIconFile</key><string>chxchx</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$installer/Contents/Info.plist"
          codesign --force --deep --sign - "$installer"
          codesign --verify --deep --strict "$installer"
          test -x "$installer/Contents/MacOS/chxchx-installer"
          mkdir installer-dmg && cp -R "$installer" installer-dmg/
          hdiutil create -volname "ChxChx Installer" -srcfolder installer-dmg -ov -format UDZO "chxchx-installer-macos-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-package
          path: chxchx-studio-macos-${{ matrix.name }}.dmg
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}-installer-package
          path: chxchx-installer-macos-${{ matrix.name }}.dmg
          if-no-files-found: error
          compression-level: 0

  cli-wheel:
    name: CLI wheel (chat, local models and the updater)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel --out-dir dist
        working-directory: old-version
      - uses: actions/upload-artifact@v4
        with:
          name: cli-wheel
          path: old-version/dist/*.whl
          if-no-files-found: error

  stage:
    name: Stage the assets and the manifest
    needs: [linux, windows, macos, cli-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Linux build serves both package families the manifest lists.
      - uses: actions/download-artifact@v4
        with: { name: linux-package, path: dist/downloads/linux-ubuntu-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: linux-package, path: dist/downloads/linux-fedora-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: linux-installer-package, path: dist/downloads/linux-installer-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: windows-package, path: dist/downloads/windows-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: windows-msi-package, path: dist/downloads/windows-msi }
      - uses: actions/download-artifact@v4
        with: { name: macos-arm64-package, path: dist/downloads/macos-arm64 }
      - uses: actions/download-artifact@v4
        with: { name: macos-x86_64-package, path: dist/downloads/macos-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: macos-arm64-installer-package, path: dist/downloads/macos-installer-arm64 }
      - uses: actions/download-artifact@v4
        with: { name: macos-x86_64-installer-package, path: dist/downloads/macos-installer-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: cli-wheel, path: dist/downloads/cli-wheel }
      - name: Write the manifest and checksums
        run: |
          if [ "${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) }}" = "stable" ]; then
            version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
            channel=stable; tag="v$version"
          else
            channel=dev; tag=studio-dev-preview
          fi
          python3 old-version/scripts/release_assets.py --root old-version \
            --channel "$channel" --tag "$tag" --commit "$GITHUB_SHA" \
            --downloads dist/downloads --output dist/release \
            --skip windows-setup --skip windows-arm64
          ls -l dist/release
          cat dist/release/studio-manifest.txt
      - name: Check each package has what the installed updater looks for
        run: |
          set -euo pipefail
          cd dist/release
          # The listings go to variables: `grep -q` closes the pipe at the first match and, with
          # pipefail, the listing program would then fail with a write error.
          linux=$(tar -tzf chxchx-studio-ubuntu-x86_64.tar.gz)
          grep -q '/bin/chxchx-studio$' <<<"$linux" || { echo "El paquete Linux no trae bin/chxchx-studio"; exit 1; }
          grep -q '/bin/chxchx-tech$' <<<"$linux" || { echo "El paquete Linux no trae bin/chxchx-tech"; exit 1; }
          grep -q '/bin/chxchx$' <<<"$linux" || { echo "El paquete Linux no trae bin/chxchx"; exit 1; }
          linux_installer=$(tar -tzf chxchx-installer-linux-x86_64.tar.gz)
          grep -q '/bin/chxchx-installer$' <<<"$linux_installer" || { echo "Falta el instalador visual Linux"; exit 1; }
          grep -q '/iniciar-instalador.sh$' <<<"$linux_installer" || { echo "Falta el lanzador del instalador Linux"; exit 1; }
          windows=$(unzip -l chxchx-studio-windows-x86_64.zip)
          grep -q 'bin/chxchx-studio.exe' <<<"$windows" || { echo "El paquete Windows no trae bin/chxchx-studio.exe"; exit 1; }
          grep -q 'bin/chxchx-tech.exe' <<<"$windows" || { echo "El paquete Windows no trae bin/chxchx-tech.exe"; exit 1; }
          grep -q 'bin/chxchx.exe' <<<"$windows" || { echo "El paquete Windows no trae bin/chxchx.exe"; exit 1; }
          ls chxchx-studio-windows-x86_64.msi chxchx-studio-macos-arm64.dmg chxchx-studio-macos-x86_64.dmg \
            chxchx-installer-macos-arm64.dmg chxchx-installer-macos-x86_64.dmg chxchx_tech_lead-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish the release
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: stage
    runs-on: ubuntu-latest
    concurrency:
      group: chxchx-studio-release-${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-assets, path: dist/release }
      - name: Replace the rolling preview tag
        if: ${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) == 'dev' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view studio-dev-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete studio-dev-preview --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/studio-dev-preview" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/studio-dev-preview"
          fi
      - name: Name the stable release
        id: stable
        if: ${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) == 'stable' }}
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # The notes of this version: its section of CHANGELOG.md.
          awk -v v="## $version" 'index($0, v)==1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - name: Publish the dev preview
        if: ${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) == 'dev' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-dev-preview
          target_commitish: ${{ github.sha }}
          name: ChxChx Studio · dev preview (Rust)
          body: |
            Rolling preview of the Rust product built from commit `${{ github.sha }}`.
            Only machines on the `dev` channel receive it; the stable channel is untouched.
            Assets: Linux x86_64, Windows x86_64 (per-user MSI and ZIP), and macOS (Apple Silicon and Intel).
            Not signed or notarized.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/release/*
      - name: Publish the stable release
        if: ${{ (inputs.channel || (github.ref_type == 'tag' && 'stable' || 'dev')) == 'stable' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stable.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ChxChx ${{ steps.stable.outputs.tag }}
          body_path: notes.md
          prerelease: false
          make_latest: true
          files: dist/release/*
