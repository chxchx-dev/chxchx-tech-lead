name: Rust product builds

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  agent-adapter:
    name: agent-adapter service (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the service and its test dependency
        run: python -m pip install pytest ./services/agent-adapter
      - name: Run the service tests
        shell: bash
        working-directory: services/agent-adapter
        run: |
          # The end of the output goes into the annotation: the job log is not visible from outside.
          set -o pipefail
          python -m pytest -q -x 2>&1 | tee test.log && exit 0
          code=${PIPESTATUS[0]}
          echo "::error title=pytest del servicio falló ($code)::$(tail -n 45 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit "$code"

  packaging:
    name: Installers and release manifest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Test install.sh, the manifest and the MSI generator
        run: python -m pytest -q packaging/tests

  product-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev
      - name: Check the full product (CLI, TUI and Studio)
        run: cargo check --locked
      - name: Check the console-only build without GUI dependencies
        run: cargo check --locked --no-default-features --features cli
      - name: Run Clippy for the full product
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust capability integration tests
        shell: bash
        run: |
          # The end of the output goes into the annotation: the job log is not visible from outside.
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log && exit 0
          code=${PIPESTATUS[0]}
          echo "::error title=cargo test falló ($code)::$(tail -n 45 test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          exit "$code"
      - name: Set up Python for JSON Schema validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned schema validator
        run: python -m pip install --requirement scripts/requirements-rust-schema.txt
      - name: Validate CLI output against the versioned overview schema
        run: python scripts/validate_project_overview_schema.py

  windows-package:
    name: Windows build of the Rust product (downloadable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build the release binaries (CLI, TUI and Studio)
        run: cargo build --locked --release
      - name: Verify Windows executable resources and runtime dependencies
        shell: pwsh
        run: ./scripts/verify_windows_binaries.ps1 -BinDirectory target/release
      - name: Smoke test the release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'target/release'
          foreach ($name in 'chxchx-tech.exe', 'chxchx-studio.exe') {
            if (-not (Test-Path "$bin/$name")) { throw "Falta $name tras compilar." }
          }
          # The CLI must read a project and print the versioned JSON contract.
          $json = & "$bin/chxchx-tech.exe" status . --json
          if ($LASTEXITCODE -ne 0) { throw "chxchx-tech status falló ($LASTEXITCODE)." }
          $overview = $json | ConvertFrom-Json
          if ($overview.schema -ne 'chxchx.project-overview') { throw "Contrato inesperado: $($overview.schema)" }
          # Studio has no console: it must stay open for a few seconds on a real project instead of exiting.
          $studio = Start-Process -FilePath "$bin/chxchx-studio.exe" -ArgumentList '.' -PassThru
          Start-Sleep -Seconds 8
          if ($studio.HasExited) {
            $log = Join-Path $env:USERPROFILE '.chxchx-tech-lead/logs/studio-startup.log'
            if (Test-Path $log) { Get-Content $log }
            throw "Studio se cerró solo (código $($studio.ExitCode))."
          }
          Stop-Process -Id $studio.Id -Force
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/chxchx-tech.exe, target/release/chxchx-studio.exe dist/
          Copy-Item scripts/studio-rust.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath chxchx-rust-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chxchx-rust-windows-x86_64
          path: chxchx-rust-windows-x86_64.zip
          retention-days: 14

