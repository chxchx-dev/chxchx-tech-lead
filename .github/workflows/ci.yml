name: CI

on:
  push:
  pull_request:

jobs:
  native-build:
    name: Native Qt build · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          modules: qt5compat
          cache: true
      - name: Configure native Studio
        run: cmake -S native -B build-native -DCHXCHX_BUILD_TESTS=ON
      - name: Build native Studio
        run: cmake --build build-native --config Release --parallel 2
      - name: Smoke test Scintilla editor
        run: ctest --test-dir build-native --build-config Release --output-on-failure

  native-fedora:
    name: Native Qt build · Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qt5compat-devel git
      - uses: actions/checkout@v4
      - name: Configure native Studio
        run: cmake -S native -B build-native -G Ninja -DCHXCHX_BUILD_TESTS=ON
      - name: Build native Studio
        run: cmake --build build-native --parallel 2
      - name: Smoke test Scintilla editor
        run: ctest --test-dir build-native --output-on-failure

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv lock --check
      - run: uv sync --dev
      - run: uv run python -m compileall src tests scripts
      - run: uv run pytest
      - run: uv run python scripts/lab_smoke.py
