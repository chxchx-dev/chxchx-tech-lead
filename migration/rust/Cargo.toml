[package]
name = "chxchx-tech"
version = "0.6.0-dev.0"
edition = "2024"
publish = false
description = "ChxChx local development control plane"
build = "build.rs"

[lib]
name = "chxchx_tech"
path = "src/lib.rs"

[[bin]]
name = "chxchx-tech"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "chxchx-studio"
path = "src/bin/chxchx-studio.rs"
required-features = ["studio"]

[features]
default = ["cli", "tui", "studio"]
cli = ["dep:clap"]
tui = ["dep:ratatui"]
studio = ["dep:iced", "dep:image", "terminal"]
terminal = ["dep:portable-pty", "dep:vt100"]

[dependencies]
clap = { version = "=4.6.7", features = ["derive"], optional = true }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "highlighter", "svg", "image-without-codecs", "canvas"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
portable-pty = { version = "=0.9.0", optional = true }
vt100 = { version = "=0.16.2", optional = true }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "macros"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting"] }
toml = "=0.9.12"

[build-dependencies]
embed-resource = "=3.0.11"

# Dependencies (iced, cosmic-text, tiny-skia, syntect) dominate UI cost, so they are
# optimised even in dev builds; the product crate stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
