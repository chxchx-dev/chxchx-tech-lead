[package]
name = "chxchx-remote"
version = "0.1.0"
edition = "2024"
publish = false
description = "ChxChx remote client: the PWA the node serves to the person's own devices (ADR 0017)"

# WebAssembly only. Built with `scripts/build-remote.sh` (see its header); it is a workspace
# member but not a default one, so plain `cargo test` and `cargo clippy` leave it alone.
[dependencies]
chxchx-protocol = { path = "../../crates/chxchx-protocol" }
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
