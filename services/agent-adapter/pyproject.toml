[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chxchx-agent-adapter"
version = "0.1.0"
description = "Live driver service for Codex and OpenCode, spoken to by ChxChx's Rust product over JSON lines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ChxChx" }]
dependencies = []

[project.scripts]
chxchx-agent-adapter = "chxchx_agent_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]
