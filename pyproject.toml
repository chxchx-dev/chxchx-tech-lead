[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chxchx-tech-lead"
version = "0.2.0"
description = "Bootstrapper and orchestration CLI for ChxChx's AI-assisted development environment."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ChxChx" }]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "textual>=0.70,<1",
]

[project.scripts]
chxchx-tech = "chxchx_tech_lead.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.package-data]
"chxchx_tech_lead.core" = ["profiles.toml"]
