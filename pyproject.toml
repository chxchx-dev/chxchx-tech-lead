[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chxchx-tech-lead"
version = "0.5.4"
description = "Bootstrapper and orchestration CLI for ChxChx's AI-assisted development environment."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ChxChx" }]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "textual>=0.70,<1",
  "psutil>=7,<8",
]

[project.scripts]
chxchx-tech = "chxchx_tech_lead.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: needs the real opencode/ollama installed (and a configured model); run with `pytest -m live`",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.package-data]
"chxchx_tech_lead.core" = ["profiles.toml", "mod_catalog/*/mod.toml", "mod_catalog/*/SKILL.md"]
"chxchx_tech_lead.skills" = ["library/skills/*/skill.toml", "library/skills/*/SKILL.md", "library/packs/*.toml"]
