[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chichan-tech-lead"
version = "0.2.0"
description = "Bootstrapper and orchestration CLI for Chichan's AI-assisted development environment."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chichan" }]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.scripts]
chichan = "chichan_tech_lead.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.package-data]
"chichan_tech_lead.core" = ["profiles.toml"]
