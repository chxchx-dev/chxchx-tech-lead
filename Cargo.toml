[package]
name = "chxchx-tech"
version = "0.7.1"
edition = "2024"
publish = false
description = "ChxChx local development control plane"
build = "build.rs"

# One product (this package) plus the wire contract its clients share (ADR 0017). No crate per
# interface: CLI, TUI and Studio stay features of this package.
[workspace]
members = ["crates/chxchx-protocol", "apps/remote"]
default-members = [".", "crates/chxchx-protocol"]

[lib]
name = "chxchx_tech"
path = "src/lib.rs"

[[bin]]
name = "chxchx-tech"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "chxchx"
path = "src/bin/chxchx.rs"
required-features = ["cli"]

[[bin]]
name = "chxchx-studio"
path = "src/bin/chxchx-studio.rs"
required-features = ["studio"]

[[bin]]
name = "chxchx-installer"
path = "src/bin/chxchx-installer.rs"
required-features = ["visual-installer"]

[[bin]]
name = "chxchx-agent-adapter"
path = "src/bin/chxchx-agent-adapter.rs"
required-features = ["agent-adapter-launcher"]

[features]
default = ["cli", "tui", "studio", "node"]
cli = ["dep:clap"]
tui = ["dep:ratatui"]
studio = ["dep:iced", "dep:image", "dep:arboard", "dep:rfd", "terminal"]
visual-installer = ["studio"]
terminal = ["dep:portable-pty", "dep:vt100"]
agent-adapter-launcher = []
# The local node (ADR 0017): an HTTP API on loopback for jobs, and the web client it serves.
node = ["cli", "dep:axum", "dep:tokio", "dep:tower", "dep:getrandom", "dep:qrcode"]

[dependencies]
chxchx-protocol = { path = "crates/chxchx-protocol" }
clap = { version = "=4.6.7", features = ["derive"], optional = true }
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "x11", "wayland", "highlighter", "svg", "image-without-codecs", "canvas", "advanced", "markdown"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
portable-pty = { version = "=0.9.0", optional = true }
vt100 = { version = "=0.16.2", optional = true }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "macros"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["preserve_order"] }
sha1 = "=0.10.6"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=3.0.0", default-features = false }
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
toml = "=0.9.12"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"], optional = true }
getrandom = { version = "=0.3.4", optional = true }
qrcode = { version = "=0.14.1", default-features = false, optional = true }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "sync", "signal", "macros", "time"], optional = true }
tower = { version = "=0.5.3", features = ["util"], optional = true }
arboard = { version = "=3.7.0", features = ["image-data", "wayland-data-control"], optional = true }
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"], optional = true }

[build-dependencies]
embed-resource = "=3.0.11"

# Dependencies (iced, cosmic-text, tiny-skia, syntect) dominate UI cost, so they are
# optimised even in dev builds; the product crate stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 3

# The web client: size matters more than speed (ADR 0017 budget: 1.5 MiB compressed).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = "debuginfo"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# A copy of iced_tiny_skia 0.14.1 with one change: plain rectangles are filled as rectangles, not
# as anti-aliased paths (see vendor/iced_tiny_skia/src/engine.rs). It made scrolling cost a fraction.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
