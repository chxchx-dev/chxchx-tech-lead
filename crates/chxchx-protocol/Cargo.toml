[package]
name = "chxchx-protocol"
version = "0.1.0"
edition = "2024"
publish = false
description = "Wire types shared by the ChxChx node and its clients (desktop, CLI and the Dioxus PWA)"

# Kept free of anything tied to an operating system: it must also build for
# wasm32-unknown-unknown (checked in CI), because the web client uses it.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
